{% extends "layout.html" %}

{% block title %}Change Password{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">Change Password</h2>
                <form action="/change_password" method="post">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Current Password</label>
                        <input class="form-control" id="current_password" name="current_password" type="password">
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password</label>
                        <input class="form-control" id="new_password" name="new_password" type="password">
                    </div>
                    <div class="mb-4">
                        <label for="confirmation" class="form-label">Confirm New Password</label>
                        <input class="form-control" id="confirmation" name="confirmation" type="password">
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-primary btn-lg" type="submit">Change Password</button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <a href="/profile" class="text-decoration-none">← Back to Profile</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
