{% extends "layout.html" %}

{% block title %}Challenge Player{% endblock %}

{% block main %}
<div class="container">
    <h1 class="mb-4">Challenge a Player</h1>
    
    <div class="card border-0 shadow">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Rating</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                            <tr>
                                <td>{{ user.username }}</td>
                                <td>{{ user.rating }}</td>
                                <td>
                                    <form action="/new_game" method="post" style="display: inline;">
                                        <input type="hidden" name="opponent" value="friend">
                                        <input type="hidden" name="friend_id" value="{{ user.id }}">
                                        <button type="submit" class="btn btn-sm btn-primary">Challenge</button>
                                    </form>
                                    <a href="/friends" class="btn btn-sm btn-outline-secondary">Add Friend</a>
                                </td>
                            </tr>
                        {% else %}
                            <tr>
                                <td colspan="3" class="text-center text-muted">No other players found</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="text-center mt-4">
        <a href="/friends" class="btn btn-outline-primary">Manage Friends</a>
        <a href="/play" class="btn btn-primary">Play vs AI</a>
    </div>
</div>
{% endblock %}
