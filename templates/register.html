{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">Register</h2>
                <form action="/register" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input autocomplete="off" autofocus class="form-control" id="username" name="username" type="text">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input class="form-control" id="email" name="email" type="email">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input class="form-control" id="password" name="password" type="password">
                        <div class="form-text">Password must be at least 8 characters long</div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmation" class="form-label">Confirm Password</label>
                        <input class="form-control" id="confirmation" name="confirmation" type="password">
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-register btn-lg text-white" type="submit">Register</button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted">Already have an account? <a href="/login" class="text-decoration-none">Log in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
